name: Deploy Migrations to Supabase

on:
  push:
    branches:
      - master
    paths:
      - 'tracker/supabase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      BRANCH_WEBHOOK_SECRET: ${{ secrets.BRANCH_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify secrets are set
        shell: bash
        run: |
          echo "PROJECT_ID is: ${SUPABASE_PROJECT_ID:+set}"
          echo "ACCESS_TOKEN is: ${SUPABASE_ACCESS_TOKEN:+set}"
          echo "DB_PASSWORD is: ${SUPABASE_DB_PASSWORD:+set}"

      - name: Authenticate Supabase CLI
        working-directory: tracker
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link Supabase project
        working-directory: tracker
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        working-directory: tracker
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Set Edge Function secrets
        working-directory: tracker
        run: |
          if [ -n "$BRANCH_WEBHOOK_SECRET" ]; then
            supabase secrets set BRANCH_WEBHOOK_SECRET="$BRANCH_WEBHOOK_SECRET" --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "::warning::BRANCH_WEBHOOK_SECRET not set — branch-webhook will accept unauthenticated POSTs"
          fi

      - name: Deploy Edge Functions
        working-directory: tracker
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
